<div class="tile {{tone}}">
  <span class=num>{{number}}</span>
  <span class=label *ngIf="label">{{label}}</span>
  <svg class="motif {{motif}}" viewBox="0 0 64 64" aria-hidden="true" [ngSwitch]="motif">
    <!-- Tannenbaum -->
    <g *ngSwitchCase="'tree'">
      <polygon points="32,6 34.4,11 40,11.6 35.8,15.2 37.2,20.6 32,17.8 26.8,20.6 28.2,15.2 24,11.6 29.6,11" class=gold />
      <polygon points="32,16 22,32 27,32 18,44 25,44 15,56 49,56 39,44 46,44 37,32 42,32" class=tree />
      <rect x="28" y="56" width="8" height="6" rx="1" class=trunk />
    </g>
    <!-- Funkeln -->
    <g *ngSwitchCase="'sparkles'" class=light>
      <path d="M44 10 C45 20 46 21 56 22 C46 23 45 24 44 34 C43 24 42 23 32 22 C42 21 43 20 44 10Z" />
      <path d="M22 34 C22.8 41 23.6 41.8 30 42.5 C23.6 43.2 22.8 44 22 51 C21.2 44 20.4 43.2 14 42.5 C20.4 41.8 21.2 41 22 34Z" />
    </g>
    <!-- Geschenk -->
    <g *ngSwitchCase="'gift'">
      <path d="M32 24 C26 14 18 16 22 22 M32 24 C38 14 46 16 42 22" class=ribbon-line fill="none" />
      <rect x="12" y="24" width="40" height="12" rx="2" class=box />
      <rect x="14" y="36" width="36" height="22" rx="2" class=box />
      <rect x="29" y="24" width="6" height="34" class=ribbon />
      <rect x="12" y="34" width="40" height="3" class=ribbon />
      <g class=dots><circle cx="19" cy="42" r="1"/><circle cx="24" cy="50" r="1"/><circle cx="44" cy="44" r="1"/><circle cx="40" cy="53" r="1"/><circle cx="18" cy="29" r="1"/><circle cx="45" cy="28" r="1"/></g>
    </g>
    <!-- Tannenzweig -->
    <g *ngSwitchCase="'branch'" class=branch>
      <path d="M6 50 L58 22" />
      <path d="M14 46 l-4 -10 M14 46 l8 4 M22 42 l-4 -10 M22 42 l8 4 M30 37.5 l-4 -10 M30 37.5 l8 4 M38 33 l-4 -10 M38 33 l8 4 M46 29 l-4 -10 M46 29 l8 4" />
    </g>
    <!-- Christbaumkugeln -->
    <g *ngSwitchCase="'ornaments'">
      <path d="M24 2 V30 M46 2 V28" class=string />
      <circle cx="24" cy="42" r="13" class=gold />
      <polygon points="24,34 26.3,39 31.6,39.4 27.6,42.8 28.8,48 24,45.2 19.2,48 20.4,42.8 16.4,39.4 21.7,39" class=light />
      <circle cx="46" cy="38" r="9" class=sage-ball />
      <polygon points="46,32.5 47.6,36 51.2,36.2 48.4,38.6 49.3,42 46,40.1 42.7,42 43.6,38.6 40.8,36.2 44.4,36" class=light />
    </g>
    <!-- Nikolausstiefel -->
    <g *ngSwitchCase="'stocking'">
      <path d="M20 16 H42 V40 C42 46 46 48 50 50 C56 53 54 62 46 61 C38 60 30 56 24 52 C18 48 20 42 20 38 Z" class=stocking />
      <rect x="17" y="10" width="28" height="10" rx="4" class=cuff />
      <g class=cuff><circle cx="27" cy="28" r="1.3"/><circle cx="34" cy="34" r="1.3"/><circle cx="28" cy="42" r="1.3"/><circle cx="36" cy="46" r="1.3"/><circle cx="44" cy="54" r="1.3"/><circle cx="33" cy="24" r="1.3"/></g>
    </g>
    <!-- Schneeflocken -->
    <g *ngSwitchCase="'snowflakes'" class=flake>
      <g transform="translate(18 18)"><path d="M0 -7 V7 M-6 -3.5 L6 3.5 M-6 3.5 L6 -3.5" /></g>
      <g transform="translate(10 48) scale(.7)"><path d="M0 -7 V7 M-6 -3.5 L6 3.5 M-6 3.5 L6 -3.5" /></g>
      <g transform="translate(50 44) scale(.8)"><path d="M0 -7 V7 M-6 -3.5 L6 3.5 M-6 3.5 L6 -3.5" /></g>
    </g>
    <!-- Sterne -->
    <g *ngSwitchCase="'stars'" class=gold>
      <polygon points="44,8 47,15 54.5,15.6 48.8,20.5 50.6,28 44,24 37.4,28 39.2,20.5 33.5,15.6 41,15" />
      <polygon points="14,28 15.8,32.2 20.3,32.6 16.9,35.5 18,40 14,37.6 10,40 11.1,35.5 7.7,32.6 12.2,32.2" />
      <polygon points="30,42 32.4,47.4 38.2,48 33.8,51.8 35.2,57.6 30,54.6 24.8,57.6 26.2,51.8 21.8,48 27.6,47.4" />
    </g>
    <!-- Beerenzweig -->
    <g *ngSwitchCase="'berries'">
      <path d="M8 58 C20 50 30 42 40 24 M26 44 C34 42 42 40 50 32 M18 50 C18 42 22 36 26 30" class=stem fill="none" />
      <g class=berry><circle cx="40" cy="22" r="4"/><circle cx="47" cy="17" r="3.5"/><circle cx="50" cy="30" r="4"/><circle cx="56" cy="24" r="3.5"/><circle cx="26" cy="28" r="3.5"/><circle cx="31" cy="21" r="3"/></g>
    </g>
    <!-- Kugel mit Schneeflocke -->
    <g *ngSwitchCase="'bauble'">
      <path d="M32 2 V22 M27 18 C29 14 35 14 37 18" class=string fill="none" />
      <circle cx="32" cy="40" r="17" class=white-ball />
      <path d="M32 30 V50 M23.3 35 L40.7 45 M23.3 45 L40.7 35" class=flake />
    </g>
    <!-- Geschenk mit Glanz -->
    <g *ngSwitchCase="'giftShine'">
      <path d="M48 10 L52 4 M54 16 L60 14 M50 22 L57 24" class=shine />
      <path d="M32 26 C26 16 20 18 23 24 M32 26 C38 16 44 18 41 24" class=gold-line fill="none" />
      <rect x="14" y="26" width="36" height="11" rx="2" class=box-light />
      <rect x="16" y="37" width="32" height="21" rx="2" class=box-light />
      <rect x="29.5" y="26" width="5" height="32" class=gold />
      <rect x="14" y="35" width="36" height="2.5" class=gold />
    </g>
  </svg>
</div>
